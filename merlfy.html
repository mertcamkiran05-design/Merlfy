  ap.append(el("h3",{text:t("settings_appearance")}));
  const themeNow = localStorage.getItem("merlfy.theme")||"system";
  const tSeg = el("div",{class:"seg"});
  [["system",t("theme_system")],["light",t("theme_light")],["dark",t("theme_dark")]].forEach(([v,lb])=>
    tSeg.append(el("button",{class:themeNow===v?"on":"",text:lb,onclick:()=>{
      localStorage.setItem("merlfy.theme",v); applyTheme(v); renderApp();
    }})));
  ap.append(field(t("theme"),tSeg));
  const lSeg = el("div",{class:"seg"});
  [["tr","Türkçe"],["en","English"]].forEach(([v,lb])=>
    lSeg.append(el("button",{class:LANG===v?"on":"",text:lb,onclick:()=>{
      LANG=v; localStorage.setItem("merlfy.lang",v); renderApp();
    }})));
  ap.append(field(t("language"),lSeg));
  wrap.append(ap);

  // accounts
  const ac = el("div",{class:"card card-pad"});
  ac.append(el("h3",{text:t("settings_accounts")}));
  const mgr = el("div",{class:"acct-manage"});
  state.users.forEach(u=>{
    const row = el("div",{class:"a"}, avatarNode(u,"lg"),
      el("span",{class:"meta"}, el("b",{text:u.displayName}), el("br"), el("span",{class:"hint",text:"@"+u.username})),
      el("span",{class:"sp"}),
      u.role==="owner"? el("span",{class:"badge",text:t("owner")}) : null,
      (state.user.role==="owner" && u.id!==state.user.id)
        ? el("button",{class:"btn sm danger",text:t("remove"),onclick:async()=>{
            if(!confirm("@"+u.username+" — "+t("remove_account_q"))) return;
            const ms = await store.memos(u.id);
            for(const m of ms){ for(const id of (m.images||[])) await idbDel("resources",id); await idbDel("memos",m.id); }
            await idbDel("users",u.id); renderApp();
          }}) : null);
    mgr.append(row);
  });
  ac.append(mgr);
  if(state.user.role==="owner"){
    ac.append(el("label",{class:"krow",style:"cursor:pointer;border:none;margin-top:8px"},
      (()=>{ const cb=el("input",{type:"checkbox"}); cb.checked=state.allowReg;
        cb.addEventListener("change",async()=>{ state.allowReg=cb.checked; await store.setSetting("allowReg",cb.checked); }); return cb; })(),
      el("span",{text:" "+t("allow_reg")})));
    ac.append(el("button",{class:"btn",style:"margin-top:10px",text:t("add_account"),onclick:addAccountModal}));
  }
  wrap.append(ac);

  // telegram
  const tg = el("div",{class:"card card-pad"});
  tg.append(el("h3",{text:t("settings_telegram")}));
  tg.append(el("p",{class:"hint",text:t("tg_intro")}));
  tg.append(el("div",{class:"krow",style:"margin-top:8px"},
    el("span",{text:t("tg_pair")}),
    el("code",{style:"font-family:var(--mono);background:var(--accent-weak);color:var(--accent);padding:2px 8px;border-radius:6px",text:state.user.pairingCode})));
  tg.append(el("p",{class:"hint",style:"margin-top:6px"}, t("tg_pair_help")+" ",
    el("code",{text:"/pair "+state.user.pairingCode})));
  const tgAll = el("input",{type:"checkbox"});
  tg.append(el("label",{class:"krow",style:"cursor:pointer;border:none;margin-top:8px"}, tgAll, el("span",{text:" "+t("tg_import_all")})));
  const tgFile = el("input",{type:"file",accept:".json,application/json",style:"display:none"});
  tgFile.addEventListener("change",e=>{ if(e.target.files[0]) importTelegram(e.target.files[0], tgAll.checked); e.target.value=""; });
  tg.append(el("button",{class:"btn primary",text:t("tg_import"),onclick:()=>tgFile.click()}), tgFile);
  wrap.append(tg);

  // data
  const dt = el("div",{class:"card card-pad"});
  dt.append(el("h3",{text:t("settings_data")}));
  dt.append(el("p",{class:"hint",text:t("export_sub")}));
  dt.append(el("div",{style:"display:flex;gap:8px;margin:8px 0 16px"},
    el("button",{class:"btn",text:t("export"),onclick:exportModal})));
  dt.append(el("p",{class:"hint",text:t("import_sub")}));
  dt.append(el("button",{class:"btn",style:"margin-top:8px",text:t("import"),onclick:importModal}));
  if(cache.memos.some(m=>!m.deletedAt)){
    dt.append(el("hr",{style:"border:none;border-top:1px solid var(--border);margin:14px 0"}));
    dt.append(el("button",{class:"btn primary",text:"📤 "+t("wrapped_btn"),onclick:shareRecap}));
  }
  wrap.append(dt);

  return wrap;
}

/* ---------- modals ---------- */
function modal(title, bodyNode, footNodes){
  const ov = el("div",{class:"overlay",onclick:e=>{ if(e.target===ov) ov.remove(); }});
  const m = el("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title});
  m.append(el("div",{class:"modal-head"}, el("h2",{text:title}),
    el("button",{class:"icon-btn","aria-label":"close",text:"✕",onclick:()=>ov.remove()})));
  m.append(el("div",{class:"modal-body"}, bodyNode));
  if(footNodes) m.append(el("div",{class:"modal-foot"}, ...footNodes));
  ov.append(m); modalRoot.append(ov);
  const esc=e=>{ if(e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown",esc); } };
  document.addEventListener("keydown",esc);
  return ov;
}
function addAccountModal(){
  const u = el("input",{class:"input"}); const d = el("input",{class:"input"});
  const p = el("input",{class:"input",type:"password"});
  const err = el("div",{class:"err",style:"display:none"});
  const body = el("div",{}, field(t("username"),u), field(t("displayname"),d), field(t("password"),p), err);
  const ov = modal(t("add_account"), body, [
    el("button",{class:"btn",text:t("cancel"),onclick:()=>ov.remove()}),
    el("button",{class:"btn primary",text:t("add_account"),onclick:async()=>{
      err.style.display="none";
      if(!u.value.trim()){ err.textContent=t("user_required"); err.style.display="block"; return; }
      if(p.value.length<4){ err.textContent=t("pass_short"); err.style.display="block"; return; }
      try{ await store.createUser({username:u.value.trim(),displayName:d.value.trim(),password:p.value}); }
      catch(ex){ err.textContent = ex.code==="taken"? t("user_taken"): ex.message; err.style.display="block"; return; }
      ov.remove(); renderApp();
    }})
  ]);
}
async function buildExport(){
  const users = await store.users();
  const memos = await idbAll("memos");
  const resources = await idbAll("resources");
  return JSON.stringify({ app:"merlfy", version:1, exportedAt:new Date().toISOString(), users, memos, resources }, null, 2);
}
async function exportModal(){
  const json = await buildExport();
  const ta = el("textarea",{class:"code-out",readonly:true}); ta.value=json;
  const ov = modal(t("export"), el("div",{}, el("p",{class:"hint",style:"margin-top:0",text:t("export_sub")}), ta), [
    el("button",{class:"btn",text:t("download"),onclick:()=>{
      const a = el("a",{href:URL.createObjectURL(new Blob([json],{type:"application/json"})), download:`merlfy-backup-${dayKey(Date.now())}.json`});
      document.body.append(a); a.click(); a.remove();
    }}),
    el("button",{class:"btn primary",text:t("copy"),onclick:()=>{ navigator.clipboard?.writeText(json); toast(t("copied")); }})
  ]);
}
async function applyBackupJson(text){
  let data; try{ data = JSON.parse(text); }catch{ return null; }
  if(!data || data.app!=="merlfy" || !Array.isArray(data.memos)) return null;
  let n=0;
  for(const u of (data.users||[])){ if(!(await idbGet("users",u.id))) await idbPut("users",u); }
  for(const r of (data.resources||[])){ if(!(await idbGet("resources",r.id))) await idbPut("resources",r); }
  for(const m of data.memos){ if(!(await idbGet("memos",m.id))){ await idbPut("memos",m); n++; } }
  return n;
}
function importModal(){
  const ta = el("textarea",{class:"code-out",placeholder:'{ "app":"merlfy", … }'});
  const file = el("input",{type:"file",accept:".json,application/json"});
  file.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ ta.value=fr.result; }; fr.readAsText(f); });
  const err = el("div",{class:"err",style:"display:none"});
  const ov = modal(t("import"), el("div",{}, el("p",{class:"hint",style:"margin-top:0",text:t("import_sub")}), file,
    el("div",{style:"height:10px"}), ta, err), [
    el("button",{class:"btn",text:t("cancel"),onclick:()=>ov.remove()}),
    el("button",{class:"btn primary",text:t("import"),onclick:async()=>{
      err.style.display="none";
      const n = await applyBackupJson(ta.value);
      if(n===null){ err.textContent=t("import_bad"); err.style.display="block"; return; }
      ov.remove(); state.users = await store.users();
      toast(n+" "+t("import_done")); renderApp();
    }})
  ]);
}
function gateImportModal(){
  const ta = el("textarea",{class:"code-out",placeholder:'{ "app":"merlfy", … }'});
  const file = el("input",{type:"file",accept:".json,application/json"});
  file.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ ta.value=fr.result; }; fr.readAsText(f); });
  const err = el("div",{class:"err",style:"display:none"});
  const ov = modal(t("gate_have_backup"), el("div",{}, el("p",{class:"hint",style:"margin-top:0",text:t("gate_import_hint")}), file,
    el("div",{style:"height:10px"}), ta, err), [
    el("button",{class:"btn",text:t("cancel"),onclick:()=>ov.remove()}),
    el("button",{class:"btn primary",text:t("import"),onclick:async()=>{
      err.style.display="none";
      const n = await applyBackupJson(ta.value);
      if(n===null){ err.textContent=t("import_bad"); err.style.display="block"; return; }
      ov.remove(); toast(n+" "+t("import_done")); renderGate();
    }})
  ]);
}

async function importTelegram(file, importAll){
  const text = await file.text();
  let data; try{ data = JSON.parse(text); }catch{ toast(t("import_bad")); return; }
  const msgs = Array.isArray(data.messages)? data.messages : [];
  const done = new Set(state.user.importedTg||[]);
  let n=0;
  for(const msg of msgs){
    const mid = String(msg.id ?? msg.message_id ?? "");
    if(!mid || done.has(mid)) continue;
    const codeOk = importAll || !msg.pairingCode || msg.pairingCode.toUpperCase()===state.user.pairingCode;
    if(!codeOk) continue;
    const ts = msg.date ? (msg.date>1e11? msg.date : msg.date*1000) : Date.now();
    const imgIds=[];
    for(const im of (msg.images||[])){
      if(typeof im==="string" && im.startsWith("data:image/")){
        const r={id:uid(),userId:state.user.id,dataUrl:im,createdAt:ts}; await idbPut("resources",r); imgIds.push(r.id);
      }
    }
    const content = (msg.text||msg.caption||"").trim() || (imgIds.length? "" : null);
    if(content===null && !imgIds.length) { done.add(mid); continue; }
    await store.saveMemo({ id:uid(), userId:state.user.id, content:content||"", visibility:"private",
      pinned:false, createdAt:ts, updatedAt:ts, deletedAt:null, images:imgIds, source:"telegram" });
    done.add(mid); n++;
  }
  state.user.importedTg = [...done];
  await idbPut("users", state.user);
  toast(n? (n+" "+t("tg_imported")) : t("tg_none"));
  renderApp();
}

/* ---------- shortcuts ---------- */
let shortcutsWired=false, gPending=false;
function wireShortcuts(){
  if(shortcutsWired) return; shortcutsWired=true;
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ $$(".overlay,.lightbox,.menu-pop").forEach(x=>x.remove()); return; }
    const tag = (e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select"||e.metaKey||e.ctrlKey||e.altKey) return;
    if(!state.user) return;
    if(gPending){
      gPending=false;
      if(e.key==="a"){ go("feed"); return; }
      if(e.key==="k"){ go("explore"); return; }
      if(e.key==="t"){ go("calendar"); return; }
      if(e.key==="c"){ go("trash"); return; }
    }
    if(e.key==="g"){ gPending=true; setTimeout(()=>gPending=false,700); return; }
    if(e.key==="n"){ e.preventDefault(); if(state.view!=="feed") go("feed"); setTimeout(()=>$("#comp-ta")?.focus(),40); return; }
    if(e.key==="/"){ e.preventDefault(); if(!["feed","explore"].includes(state.view)) go("feed"); setTimeout(()=>$("#search-in")?.focus(),40); return; }
    if(e.key==="?"){ e.preventDefault(); shortcutsModal(); return; }
  });
}
function shortcutsModal(){
  const rows = [["n",t("sc_new")],["/",t("sc_search")],["g a",t("sc_feed")],["g k",t("sc_explore")],
    ["g t",t("nav_calendar")],["g c",t("nav_trash")],["⌘/Ctrl ↵",t("save")],["?",t("sc_help")],["Esc",t("sc_close")]];
  const body = el("div",{});
  rows.forEach(([k,d])=> body.append(el("div",{class:"krow"}, el("span",{text:d}), el("span",{class:"kbd",text:k}))));
  modal(t("shortcuts"), body);
}

async function logout(){
  await store.setSession(null);
  state.user=null; state.view="feed"; state.filter={tag:null,q:"",date:null,vis:"all",hasImage:false};
  renderGate();
}

   boot
   ===================================================================== */
(async function boot(){
  try{
    await bootPrefs();
    const sid = await store.session();
    if(sid){
      const u = await idbGet("users", sid);
      if(u){ state.user=u; state.users=await store.users(); renderApp(); return; }
    }
  }catch(err){ console.error(err); }
  renderGate();
})();

})();
