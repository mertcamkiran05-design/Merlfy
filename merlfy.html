<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Merlfy</title>
<meta name="description" content="Kişisel, çok profilli memo defteri.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Merlfy">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ecedee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131719">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    color-scheme:light;
    --bg:#ecedee; --surface:#f7f8f8; --surface-2:#eef0f0; --raise:#ffffff;
    --text:#1b262c; --text-dim:#586870; --text-faint:#8a979d;
    --border:#d5dadc; --border-strong:#c1c8cb;
    --accent:#b06a26; --accent-ink:#ffffff; --accent-weak:#efe4d4; --accent-line:#d9b98d;
    --link:#2c6b66;
    --good:#3d7a4c; --warn:#a9791f; --danger:#ad3a33;
    --hm0:#e3e5e6; --hm1:#e6cfa9; --hm2:#d5a35f; --hm3:#b87a2f; --hm4:#8c5716;
    --shadow:0 1px 2px rgba(20,30,35,.06), 0 6px 20px -8px rgba(20,30,35,.14);
    --shadow-pop:0 12px 40px -12px rgba(20,30,35,.32);
    --r:12px; --r-sm:8px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --display:"Bricolage Grotesque",var(--sans);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    color-scheme:dark;
    --bg:#131719; --surface:#1b2124; --surface-2:#20272a; --raise:#232b2e;
    --text:#e5e8e8; --text-dim:#98a3a7; --text-faint:#6c777b;
    --border:#2d3538; --border-strong:#3b4448;
    --accent:#d3873c; --accent-ink:#1b1204; --accent-weak:#33281b; --accent-line:#5a4a31;
    --link:#68b2ab;
    --good:#5fa06e; --warn:#c99a3f; --danger:#d6605a;
    --hm0:#242b2e; --hm1:#4a3a22; --hm2:#7a5423; --hm3:#a9762f; --hm4:#d3873c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    --shadow-pop:0 16px 50px -12px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#131719; --surface:#1b2124; --surface-2:#20272a; --raise:#232b2e;
    --text:#e5e8e8; --text-dim:#98a3a7; --text-faint:#6c777b;
    --border:#2d3538; --border-strong:#3b4448;
    --accent:#d3873c; --accent-ink:#1b1204; --accent-weak:#33281b; --accent-line:#5a4a31;
    --link:#68b2ab;
    --good:#5fa06e; --warn:#c99a3f; --danger:#d6605a;
    --hm0:#242b2e; --hm1:#4a3a22; --hm2:#7a5423; --hm3:#a9762f; --hm4:#d3873c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    --shadow-pop:0 16px 50px -12px rgba(0,0,0,.7);
  }

  /* ============ BASE ============ */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  ::selection{background:var(--accent-weak)}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);
    border:1px solid var(--border-strong);background:var(--raise);font-weight:500;font-size:14px;
    transition:border-color .12s,background .12s,transform .05s}
  .btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.danger{color:var(--danger);border-color:transparent}
  .btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:5px 9px;font-size:13px}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim)}
  .input{width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
    background:var(--surface);transition:border-color .12s}
  .input:focus{border-color:var(--accent);outline:none}
  .hint{font-size:12.5px;color:var(--text-faint)}
  .err{font-size:13px;color:var(--danger)}

  /* ============ AUTH ============ */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(circle at 12% 18%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 42%),
      radial-gradient(circle at 88% 82%,color-mix(in srgb,var(--link) 10%,transparent),transparent 45%),
      var(--bg)}
  .gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);padding:30px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .brand .mark{font-size:26px;line-height:1}
  .brand .name{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
  .gate-card .tag{color:var(--text-dim);font-size:13.5px;margin:0 0 22px}
  .acct-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .acct-chips button{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:999px;
    border:1px solid var(--border-strong);background:var(--raise);font-size:13px}
  .acct-chips button:hover{border-color:var(--accent-line)}
  .avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--accent-weak);
    display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent);flex:none}
  .avatar.lg{width:34px;height:34px;font-size:15px}
  .switch-line{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px}

  /* ============ SHELL ============ */
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr) 304px;gap:26px;
    max-width:1240px;margin:0 auto;padding:24px 24px 96px}
  .rail{display:flex;flex-direction:column;gap:18px}
  .rail-left{position:sticky;top:24px;align-self:start}
  .rail-right{position:sticky;top:24px;align-self:start}

  .side-brand{display:flex;align-items:center;gap:9px;padding:2px 6px 8px}
  .side-brand .mark{font-size:20px}
  .side-brand .name{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-sm);
    font-size:14px;font-weight:500;color:var(--text-dim);text-align:left;transition:background .12s,color .12s}
  .nav button svg{width:17px;height:17px;flex:none;stroke-width:1.8}
  .nav button:hover{background:var(--surface-2);color:var(--text)}
  .nav button.on{background:var(--accent-weak);color:var(--accent)}
  .nav .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-faint)}

  .who{margin-top:6px;border-top:1px solid var(--border);padding-top:12px}
  .who-row{display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--r-sm);width:100%}
  .who-row:hover{background:var(--surface-2)}
  .who-row .meta{min-width:0;text-align:left}
  .who-row .meta b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who-row .meta span{font-size:11.5px;color:var(--text-faint)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-pad{padding:16px}
  .card h3{margin:0 0 12px;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.01em}

  /* stats */
  .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);
    border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .stat{background:var(--surface);padding:12px 14px}
  .stat b{display:block;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--text-dim);letter-spacing:.03em;text-transform:uppercase}
  .stat.streak b{color:var(--accent)}

  /* heatmap */
  .heat{overflow-x:auto;padding-bottom:4px}
  .heat svg{display:block}
  .heat rect.cell{rx:2px}
  .heat .lbl{font-family:var(--mono);font-size:8.5px;fill:var(--text-faint)}
  .heat-legend{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--text-faint)}
  .heat-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

  /* tag cloud */
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag-chip{font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--border-strong);background:var(--raise);color:var(--text-dim);transition:all .12s}
  .tag-chip:hover{border-color:var(--accent-line);color:var(--accent)}
  .tag-chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tag-chip .n{opacity:.6;margin-left:4px}

  /* ============ COMPOSER ============ */
  .composer{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
  .composer:focus-within{border-color:var(--accent-line)}
  .composer textarea{width:100%;border:none;background:none;resize:none;padding:15px 16px 6px;
    font-size:15.5px;line-height:1.6;min-height:76px;max-height:420px;outline:none;display:block}
  .composer .preview{padding:15px 16px 6px;font-size:15px;border-bottom:1px dashed var(--border)}
  .comp-imgs{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 4px}
  .comp-imgs figure{position:relative;margin:0}
  .comp-imgs img{width:74px;height:74px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border)}
  .comp-imgs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;box-shadow:var(--shadow)}
  .comp-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface-2)}
  .comp-bar .sp{flex:1}
  .comp-count{font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .comp-bar select{padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--raise);font-size:13px}
  .icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-dim)}
  .icon-btn:hover{background:var(--raise);color:var(--text)}
  .icon-btn svg{width:17px;height:17px;stroke-width:1.8}
  .icon-btn.on{color:var(--accent);background:var(--accent-weak)}
  .kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--border-strong);
    border-bottom-width:2px;border-radius:5px;color:var(--text-faint);background:var(--raise)}

  /* ============ FILTER BAR ============ */
  .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 2px 12px;font-size:13px}
  .filterbar .active{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;
    border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:500}
  .filterbar .active button{color:inherit;font-size:14px;line-height:1}
  .search-wrap{position:relative;flex:1;min-width:180px}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint)}
  .search-wrap input{width:100%;padding:7px 10px 7px 31px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface)}
  .search-wrap input:focus{border-color:var(--accent);outline:none}

  /* ============ MEMO ============ */
  .feed{display:flex;flex-direction:column;gap:12px}
  .memo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;
    box-shadow:var(--shadow);transition:border-color .12s}
  .memo:hover{border-color:var(--border-strong)}
  .memo.pinned{border-color:var(--accent-line)}
  .memo-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px;color:var(--text-faint)}
  .memo-head .who-name{font-weight:600;color:var(--text-dim)}
  .memo-head time{font-family:var(--mono);font-size:11.5px}
  .memo-head .vis{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--border-strong)}
  .memo-head .pin-flag{color:var(--accent)}
  .memo-head .sp{flex:1}
  .memo-menu{position:relative}
  .memo-menu>button{width:26px;height:26px;border-radius:6px;color:var(--text-faint)}
  .memo-menu>button:hover{background:var(--surface-2);color:var(--text)}
  .menu-pop{position:absolute;right:0;top:30px;z-index:20;background:var(--raise);border:1px solid var(--border);
    border-radius:var(--r-sm);box-shadow:var(--shadow-pop);padding:5px;min-width:160px;display:flex;flex-direction:column}
  .menu-pop button{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:13.5px;text-align:left}
  .menu-pop button:hover{background:var(--surface-2)}
  .menu-pop button.danger{color:var(--danger)}
  .menu-pop hr{border:none;border-top:1px solid var(--border);margin:4px 0}

  .prose{overflow-wrap:break-word;word-break:break-word}
  .prose>*:first-child{margin-top:0}
  .prose>*:last-child{margin-bottom:0}
  .prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--display);line-height:1.3;margin:1em 0 .4em;text-wrap:balance}
  .prose h1{font-size:1.4em}.prose h2{font-size:1.22em}.prose h3{font-size:1.08em}.prose h4{font-size:1em}
  .prose p{margin:.5em 0}
  .prose ul,.prose ol{margin:.5em 0;padding-left:1.4em}
  .prose li{margin:.2em 0}
  .prose li.task{list-style:none;margin-left:-1.4em;padding-left:1.4em;position:relative}
  .prose li.task input{position:absolute;left:0;top:.3em}
  .prose blockquote{margin:.6em 0;padding:.2em 0 .2em 12px;border-left:3px solid var(--accent-line);color:var(--text-dim)}
  .prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.12em .38em;border-radius:5px}
  .prose pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:12px 13px;overflow-x:auto;margin:.7em 0}
  .prose pre code{background:none;padding:0;font-size:.86em;line-height:1.5}
  .prose hr{border:none;border-top:1px solid var(--border-strong);margin:1em 0}
  .prose a{text-decoration:underline;text-underline-offset:2px}
  .prose table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:.92em;display:block;overflow-x:auto}
  .prose th,.prose td{border:1px solid var(--border-strong);padding:6px 10px;text-align:left}
  .prose th{background:var(--surface-2);font-weight:600}
  .prose img{border-radius:var(--r-sm);border:1px solid var(--border);margin:.4em 0}
  .prose .in-tag{font-family:var(--mono);font-size:.92em;color:var(--accent);cursor:pointer}
  .prose .in-tag:hover{text-decoration:underline}

  .memo-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
  .memo-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border);cursor:zoom-in}
  .memo-imgs.single{grid-template-columns:minmax(0,320px)}
  .memo-imgs.single img{aspect-ratio:auto;max-height:360px;width:auto;max-width:100%}

  .memo-edit textarea{width:100%;border:1px solid var(--accent-line);border-radius:var(--r-sm);background:var(--surface-2);
    padding:10px 12px;resize:vertical;min-height:90px;font-size:15px;line-height:1.6;outline:none}
  .memo-edit .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

  .empty{text-align:center;padding:54px 20px;color:var(--text-faint)}
  .empty .big{font-size:30px;margin-bottom:8px}
  .empty p{margin:4px 0}

  .load-more{margin:16px auto 0;display:block}

  /* ============ MODAL ============ */
  .overlay{position:fixed;inset:0;background:color-mix(in srgb,#0a0f11 55%,transparent);
    display:grid;place-items:center;padding:20px;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow-pop);max-width:520px;width:100%;max-height:88vh;overflow-y:auto}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
  .modal-head h2{margin:0;font-family:var(--display);font-size:17px}
  .modal-body{padding:18px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}
  textarea.code-out{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;border:1px solid var(--border-strong);
    border-radius:var(--r-sm);background:var(--surface-2);padding:10px;resize:vertical}
  .lightbox{position:fixed;inset:0;background:rgba(8,10,12,.9);display:grid;place-items:center;z-index:200;padding:24px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-sm)}

  .krow{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
  .krow:last-child{border:none}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-pop);z-index:300}

  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
  .seg button{padding:6px 12px;font-size:13px;color:var(--text-dim)}
  .seg button.on{background:var(--accent-weak);color:var(--accent)}
  .seg button+button{border-left:1px solid var(--border-strong)}

  /* ============ MOLA / OYUN ============ */
  .game-card{max-width:520px}
  .game-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:16px;flex-wrap:wrap}
  .game-stat{display:flex;flex-direction:column;line-height:1.15}
  .game-stat b{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .game-stat span{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
  .game-head .sp{flex:1}
  .game-status{margin-top:14px;font-weight:600;min-height:1.3em}
  .game-status .rec{color:var(--accent)}
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mem-card{aspect-ratio:1;border-radius:var(--r-sm);border:1px solid var(--border-strong);
    background:var(--surface-2);font-size:26px;display:grid;place-items:center;
    transition:transform .1s,background .12s,border-color .12s}
  .mem-card:not(:disabled):hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .mem-card.open{background:var(--raise);border-color:var(--accent-line)}
  .mem-card.matched{background:var(--accent-weak);border-color:var(--accent-line);opacity:.65}
  .math-q{font-family:var(--display);font-size:34px;font-weight:700;text-align:center;
    padding:20px 0 16px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .math-in{font-size:20px;text-align:center;font-family:var(--mono);max-width:180px;margin:0 auto;display:block}

const $ = (s,r=document)=>r.querySelector(s);

function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k==="text") n.textContent=v;
    else if(k.startsWith("on")&&typeof v==="function") n.addEventListener(k.slice(2),v);
    else if(k==="dataset") Object.assign(n.dataset,v);
    else n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue;
    n.append(kid.nodeType? kid : document.createTextNode(String(kid))); }
  return n;
}

/* ---------- crypto (PBKDF2) ---------- */
async function hashPassword(pass, saltB64){
  const enc = new TextEncoder();
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0))
                       : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"}, key, 256);
  const hashB64 = btoa(String.fromCharCode(...new Uint8Array(bits)));
  const sB64 = saltB64 || btoa(String.fromCharCode(...salt));
  return sB64+":"+hashB64;
}
async function verifyPassword(pass, stored){
  const [saltB64] = stored.split(":");
  const got = await hashPassword(pass, saltB64);
  return got === stored;
}

/* ---------- IndexedDB ---------- */
const DB_NAME="merlfy", DB_VER=2;
let _db;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("users")) d.createObjectStore("users",{keyPath:"id"});
      if(!d.objectStoreNames.contains("memos")){
        const s = d.createObjectStore("memos",{keyPath:"id"});
        s.createIndex("userId","userId"); s.createIndex("createdAt","createdAt");
      }
      if(!d.objectStoreNames.contains("resources")) d.createObjectStore("resources",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
      if(!d.objectStoreNames.contains("scores")){
        const s = d.createObjectStore("scores",{keyPath:"id"});
        s.createIndex("game","game");
      }
    };
    r.onsuccess = ()=>{ _db=r.result; res(_db); };
    r.onerror = ()=>rej(r.error);
  });
}
function tx(store, mode="readonly"){ return db().then(d=>d.transaction(store,mode).objectStore(store)); }
const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const idbGet   = (s,k)=> tx(s).then(o=>req(o.get(k)));
const idbAll   = s => tx(s).then(o=>req(o.getAll()));
const idbPut   = (s,v)=> tx(s,"readwrite").then(o=>req(o.put(v)));
const idbDel   = (s,k)=> tx(s,"readwrite").then(o=>req(o.delete(k)));
async function idbByUser(store, userId){
  const o = await tx(store);
  return new Promise((res,rej)=>{
    const out=[]; const idx=o.index("userId");
    const c = idx.openCursor(IDBKeyRange.only(userId));
    c.onsuccess = e=>{ const cur=e.target.result; if(cur){ out.push(cur.value); cur.continue(); } else res(out); };
    c.onerror = ()=>rej(c.error);
  });
}

/* ---------- data layer ---------- */
const store = {
  async users(){ return (await idbAll("users")).sort((a,b)=>a.createdAt-b.createdAt); },
  async session(){ const m = await idbGet("meta","session"); return m? m.userId : null; },
  async setSession(id){ if(id) await idbPut("meta",{key:"session",userId:id}); else await idbDel("meta","session"); },
  async getSetting(k,def){ const m = await idbGet("meta","set:"+k); return m? m.value : def; },
  async setSetting(k,v){ await idbPut("meta",{key:"set:"+k,value:v}); },
  async createUser({username,displayName,password,role="member"}){
    const users = await store.users();
    if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ const e=new Error("taken"); e.code="taken"; throw e; }
    const u = { id:uid(), username, displayName:displayName||username, avatar:"",
      passwordHash: await hashPassword(password),
      role: users.length? role : "owner",
      pairingCode: Math.random().toString(36).slice(2,8).toUpperCase(),
      importedTg: [], createdAt: Date.now() };
    await idbPut("users",u);
    return u;
  },
  async memos(userId){ return (await idbByUser("memos",userId)); },
  async allSharedMemos(){
    const all = await idbAll("memos");
    return all.filter(m=>!m.deletedAt && (m.visibility==="workspace"||m.visibility==="public"));
  },
  async resource(id){ return idbGet("resources",id); },
  async saveMemo(m){ if(m.updatedAt==null) m.updatedAt = m.createdAt||Date.now(); await idbPut("memos",m); return m; },
};

const scoreStore = {

  },

/* ---------- image downscale ---------- */
function fileToImage(file){
  return new Promise((res,rej)=>{
    if(!file.type.startsWith("image/")){ rej(new Error("not image")); return; }
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1600;
        let {width:w, height:h} = img;
        if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const cv = el("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const type = file.type==="image/png" ? "image/png" : "image/jpeg";
        res(cv.toDataURL(type, .85));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ========================================================================
   Markdown  — güvenli alt küme (HTML kaçışlı)
   ===================================================================== */
function safeUrl(u, allowData){
  u = u.trim();
  if(/^(https?:|mailto:)/i.test(u)) return u;
  if(allowData && /^data:image\/(png|jpe?g|gif|webp|avif);/i.test(u)) return u;
  if(/^[^:]+$/.test(u) && !u.startsWith("//")) return u; // relative-ish, no scheme
  return null;
}
function mdInline(src){
  let s = esc(src);
  // inline code
  s = s.replace(/`([^`\n]+)`/g, (_,c)=>`<code>${c}</code>`);
  // images
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, (m,alt,url)=>{
    const u = safeUrl(url, true); return u? `<img src="${u}" alt="${alt}" loading="lazy">` : esc(m);
  });
  // links
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, (m,txt,url)=>{
    const u = safeUrl(url,false); return u? `<a href="${u}" target="_blank" rel="noopener noreferrer">${txt}</a>` : esc(m);
  });
  // bold / italic / strike
  s = s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_\n]+)__/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,"$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g,"$1<em>$2</em>");
  s = s.replace(/~~([^~\n]+)~~/g,"<del>$1</del>");
  // bare urls
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_,pre,url)=>`${pre}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  // #tags (avoid inside code/attrs — code already wrapped, tags won't sit in href because those are urls)
  s = s.replace(/(^|[\s(>])#([\p{L}_][\p{L}\p{N}_/-]*)/gu,
    (_,pre,tag)=>`${pre}<span class="in-tag" data-tag="${esc(tag.toLowerCase())}">#${esc(tag)}</span>`);
  return s;
}
function startsBlock(line){
  return /^ {0,3}(#{1,6}\s|>|```|([-*+]|\d+[.)])\s|([-*_])( *\3){2,}\s*$)/.test(line);
}
function splitRow(line){
  return line.replace(/^\s*\|?/,"").replace(/\|?\s*$/,"").split("|").map(c=>c.trim());
}
let _taskSeq = 0;
function renderMarkdown(src){ _taskSeq = 0; return _renderMd(src); }
// toplam memo metninde n. görev kutusunu [ ] <-> [x] çevir (renderMarkdown ile aynı sırada sayar)
function toggleTaskInContent(content, n){
  let i = -1;
  return String(content).replace(/^( {0,3}(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/gm, (m,pre,mark)=>{
    i++; if(i!==n) return m;
    return pre + (mark.toLowerCase()==="x" ? "[ ]" : "[x]");
  });
}
function _renderMd(src){
  const lines = String(src||"").replace(/\r\n?/g,"\n").split("\n");
  const out = []; let i=0;
  while(i<lines.length){
    let line = lines[i];
    if(/^\s*```/.test(line)){
      const lang = line.trim().slice(3).trim();
      const buf=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code${lang?` class="lang-${esc(lang)}"`:""}>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    if(line.trim()===""){ i++; continue; }
    if(/^ {0,3}([-*_])( *\1){2,} *$/.test(line)){ out.push("<hr>"); i++; continue; }
    let m = /^ {0,3}(#{1,6})\s+(.*)$/.exec(line);
    if(m){ const lv=m[1].length; out.push(`<h${lv}>${mdInline(m[2].replace(/\s+#+\s*$/,""))}</h${lv}>`); i++; continue; }
    if(/^ {0,3}>/.test(line)){
      const buf=[];
      while(i<lines.length && /^ {0,3}>/.test(lines[i])){ buf.push(lines[i].replace(/^ {0,3}>\s?/,"")); i++; }
      out.push(`<blockquote>${_renderMd(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if(line.includes("|") && i+1<lines.length && /^ {0,3}\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes("-")){
      const header = splitRow(line);
      const aligns = splitRow(lines[i+1]).map(c=>{
        const l=c.startsWith(":"), r=c.endsWith(":");
        return l&&r?"center":r?"right":l?"left":"";
      });
      i+=2; const rows=[];
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()!==""){ rows.push(splitRow(lines[i])); i++; }
      let h = "<table><thead><tr>"+header.map((c,x)=>`<th${aligns[x]?` style="text-align:${aligns[x]}"`:""}>${mdInline(c)}</th>`).join("")+"</tr></thead><tbody>";
      h += rows.map(r=>"<tr>"+r.map((c,x)=>`<td${aligns[x]?` style="text-align:${aligns[x]}"`:""}>${mdInline(c)}</td>`).join("")+"</tr>").join("");
      out.push(h+"</tbody></table>");
      continue;
    }
    if(/^ {0,3}([-*+]|\d+[.)])\s+/.test(line)){
      const ordered = /^ {0,3}\d/.test(line);
      const items=[];
      while(i<lines.length && /^ {0,3}([-*+]|\d+[.)])\s+/.test(lines[i])){
        let it = lines[i].replace(/^ {0,3}([-*+]|\d+[.)])\s+/,""); i++;
        while(i<lines.length && lines[i].trim()!=="" && /^\s{2,}\S/.test(lines[i]) && !/^ {0,3}([-*+]|\d+[.)])\s+/.test(lines[i])){
          it += "\n"+lines[i].trim(); i++;
        }
        items.push(it);
      }
      const li = items.map(it=>{
        const task = /^\[([ xX])\]\s+/.exec(it);
        if(task){
          const checked = task[1].toLowerCase()==="x";
          const ti = _taskSeq++;
          return `<li class="task"><input type="checkbox" data-task="${ti}"${checked?" checked":""}> ${mdInline(it.slice(task[0].length)).replace(/\n/g,"<br>")}</li>`;
        }
        return `<li>${mdInline(it).replace(/\n/g,"<br>")}</li>`;
      }).join("");
      out.push(ordered?`<ol>${li}</ol>`:`<ul>${li}</ul>`);
      continue;
    }
    // paragraph
    const buf=[line]; i++;
    while(i<lines.length && lines[i].trim()!=="" && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    out.push(`<p>${mdInline(buf.join("\n")).replace(/\n/g,"<br>")}</p>`);
  }
  return out.join("\n");
}
function extractTags(text){
  const set = new Set(); const re = /(^|[\s(])#([\p{L}_][\p{L}\p{N}_/-]*)/gu; let m;
  while((m=re.exec(text))) set.add(m[2].toLowerCase());
  return [...set];
}
function wordCount(s){ return (String(s||"").trim().match(/\S+/g)||[]).length; }

function onThisDay(live){
  const now = new Date(), out = [];
  const md = d => d.getMonth()*100 + d.getDate();
  const t0 = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  for(const m of live){
    const d = new Date(m.createdAt);
    const yrs = now.getFullYear() - d.getFullYear();
    const diff = Math.round((t0 - new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/86400000);
    let label = null;
    if(yrs>=1 && md(d)===md(now)) label = yrs===1 ? t("onthisday_year") : yrs+" "+t("onthisday_years");
    else if(diff===7) label = t("onthisday_week");
    else if(diff===30) label = t("onthisday_month");
    else if([90,180,365].includes(diff)) label = diff+" "+t("onthisday_days");
    if(label) out.push({ memo:m, label });
  }
  return out.sort((a,b)=>b.memo.createdAt-a.memo.createdAt).slice(0,5);
}

const BADGES = [
  { id:"first",   icon:"🌱", test:s=>s.memos>=1 },
  { id:"streak7", icon:"🔥", test:s=>s.streak>=7 },
  { id:"streak30",icon:"🏔", test:s=>s.streak>=30 },
  { id:"century", icon:"💯", test:s=>s.memos>=100 },
  { id:"night",   icon:"🦉", test:s=>s.night },
  { id:"early",   icon:"🐦", test:s=>s.early },
  { id:"tagger",  icon:"🏷", test:s=>s.tags>=10 },
  { id:"pics",    icon:"🖼", test:s=>s.withImages>=10 },
  { id:"days30",  icon:"📅", test:s=>s.days>=30 },
  { id:"words",   icon:"✍️", test:s=>s.words>=5000 },
];
function computeStats(live){
  const days = new Set(), tags = new Set(); let words=0, withImages=0, night=false, early=false, first=Infinity;
  for(const m of live){
    days.add(dayKey(m.createdAt));
    extractTags(m.content).forEach(x=>tags.add(x));
    words += wordCount(m.content);
    if(m.images && m.images.length) withImages++;
    const h = new Date(m.createdAt).getHours();
    if(h<5) night = true; else if(h<8) early = true;
    if(m.createdAt<first) first = m.createdAt;
  }
  return { memos:live.length, days:days.size, tags:tags.size, words, withImages, night, early,
    streak: streak(days), first: first===Infinity ? Date.now() : first };
}
function earnedBadges(stats){ return BADGES.filter(b=>b.test(stats)); }
let engagementReady = false;   // ilk hidrasyon geçene kadar kutlama yok
function checkEngagement(live){
  const stats = computeStats(live);
  // rozetler
  const now = earnedBadges(stats).map(b=>b.id);
  const bKey = "merlfy.badges."+state.user.id;
  let seen = []; try{ seen = JSON.parse(localStorage.getItem(bKey)||"[]"); }catch{}
  const fresh = now.filter(id=>!seen.includes(id));
  if(now.length!==seen.length){ try{ localStorage.setItem(bKey, JSON.stringify(now)); }catch{} }
  // seri kilometre taşları
  const sKey = "merlfy.streakMile."+state.user.id;
  let last = 0; try{ last = +localStorage.getItem(sKey)||0; }catch{}
  const reached = STREAK_MILES.filter(m=>m<=stats.streak).pop() || 0;
  const milestoneHit = reached>last;
  if(milestoneHit){ try{ localStorage.setItem(sKey, String(reached)); }catch{} }

  if(!engagementReady){ engagementReady = true; return; }
  if(fresh.length){
    const b = BADGES.find(x=>x.id===fresh[0]);
    setTimeout(()=>{ toast(`${b.icon} ${t("badge_new")} — ${t("b_"+b.id)}`); celebrate(); }, 350);
  } else if(milestoneHit){
    setTimeout(()=>{ toast(`🔥 ${reached} ${t("streak_milestone_1")} ${t("streak_milestone_2")}`); celebrate(); }, 400);
  }
}

function roundRect(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y);
  x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrapLines(x, text, maxW){
  const words = String(text).split(/\s+/), lines = []; let line = "";
  for(const w of words){
    const test = line ? line+" "+w : w;
    if(x.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test;
  }
  if(line) lines.push(line);
  return lines;
}
function cardTheme(){
  const dark = document.documentElement.dataset.theme==="dark"
    || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  return dark
    ? { bg:"#15191b", card:"#1f272a", ink:"#e9ecec", dim:"#98a3a7", accent:"#d3873c" }
    : { bg:"#e9e0d2", card:"#fbf9f5", ink:"#20292e", dim:"#6b7a80", accent:"#b06a26" };
}
function newCanvas(w,h){ const c = el("canvas"); c.width = w; c.height = h; return c; }
const HM_COLS = ["#e3e5e6","#e6cfa9","#d5a35f","#b87a2f","#8c5716"];

function drawMemoCard(memo, author){
  const T=cardTheme(), W=1080, pad=160, lh=66;
  const tags = extractTags(memo.content||"").slice(0,6);
  const raw = (memo.content||"")
    .replace(/!\[[^\]]*\]\([^)]*\)/g,"")
    .replace(/(^|\s)#[\p{L}\p{N}_/-]+/gu," ")   // etiketleri gövdeden ayır
    .replace(/[>*_`|#]/g,"").replace(/\s+/g," ").trim() || "…";
  const mc = newCanvas(4,4).getContext("2d"); mc.font="600 48px Georgia,serif";
  let lines = wrapLines(mc, raw, W-pad-150);
  if(lines.length>12){ lines = lines.slice(0,12); lines[11] = lines[11].replace(/\s+\S*$/,"")+" …"; }
  const top=196, bodyH=lines.length*lh;
  const tagsY = top + bodyH + 46;
  const footY = tagsY + (tags.length?54:0) + 46;
  const H = Math.round(footY + 96);
  const c=newCanvas(W,H), x=c.getContext("2d");
  x.textBaseline="alphabetic";
  x.fillStyle=T.bg; x.fillRect(0,0,W,H);
  x.fillStyle=T.card; roundRect(x,52,52,W-104,H-104,40); x.fill();
  x.fillStyle=T.accent; x.fillRect(pad-28,132,7,Math.min(bodyH,150));
  x.fillStyle=T.ink; x.font="600 48px Georgia,'Times New Roman',serif";
  lines.forEach((ln,i)=> x.fillText(ln, pad, top + i*lh));
  if(tags.length){
    x.fillStyle=T.accent; x.font="500 29px 'IBM Plex Mono',monospace";
    x.fillText(tags.map(g=>"#"+g).join("   "), pad, tagsY);
  }
  x.fillStyle=T.accent; x.font="700 33px Georgia,serif"; x.fillText("🪶 Merlfy", pad, footY);
  x.fillStyle=T.dim; x.font="400 27px -apple-system,'Segoe UI',sans-serif";
  x.fillText("@"+(author?.username||state.user.username)+"   ·   "+fmtDate(memo.createdAt), pad, footY+40);
  return c;
}

function drawRecapCard(live, period){
  const winDays = period==="30" ? 30 : period==="7" ? 7 : 0;
  if(winDays){ const cut = Date.now() - winDays*86400000; live = live.filter(m=>m.createdAt>=cut); }
  const s = computeStats(live), W=1080, M=96;
  const counts={}; live.forEach(m=>extractTags(m.content).forEach(tg=>counts[tg]=(counts[tg]||0)+1));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const hc={}; live.forEach(m=>{ const k=dayKey(m.createdAt); hc[k]=(hc[k]||0)+1; });

  // ---- layout (canvas boyutu içeriğe göre) ----
  const gy=228, gw=(W-M*2-30)/2, gh=246;
  const gridBottom = gy + 2*gh + 28;
  let tagsLabelY = gridBottom + 78, tagRows = top.length ? Math.ceil(top.length/3) : 0;
  const hy = (top.length ? tagsLabelY + 30 + tagRows*58 : gridBottom + 60);
  const WK=26, cell=26, gap=7, hmBottom = hy + 7*(cell+gap-2);
  const footLineY = hmBottom + 66, footTextY = footLineY + 46;
  const H = Math.round(footTextY + 44);

  const c=newCanvas(W,H), x=c.getContext("2d"), T=cardTheme();
  x.textBaseline="alphabetic";
  x.fillStyle=T.bg; x.fillRect(0,0,W,H);

  x.fillStyle=T.accent; x.font="700 46px 'Bricolage Grotesque',Georgia,serif";
  x.fillText("🪶 "+t("wrapped_title"), M, 116);
  x.fillStyle=T.dim; x.font="400 30px -apple-system,'Segoe UI',sans-serif";
  x.fillText("@"+state.user.username + (winDays ? "   ·   "+(winDays===30?t("recap_30"):t("recap_7")) : ""), M, 162);

  [[s.memos,t("wrapped_memos")],[s.streak,t("wrapped_streak")],[s.days,t("wrapped_days")],[s.words,t("wrapped_words")]]
    .forEach(([n,lb],i)=>{
      const cx = M + (i%2)*(gw+30), cy = gy + Math.floor(i/2)*(gh+28);
      x.fillStyle=T.card; roundRect(x,cx,cy,gw,gh,28); x.fill();
      x.fillStyle=T.accent; x.font="700 90px 'Bricolage Grotesque',Georgia,serif";
      x.fillText(String(n), cx+40, cy+136);
      x.fillStyle=T.dim; x.font="600 24px -apple-system,'Segoe UI',sans-serif";
      x.fillText(String(lb).toUpperCase(), cx+42, cy+188);
    });

  if(top.length){
    x.fillStyle=T.ink; x.font="600 32px -apple-system,'Segoe UI',sans-serif";
    x.fillText(t("wrapped_toptags"), M, tagsLabelY);
    x.font="500 35px 'IBM Plex Mono',monospace"; x.fillStyle=T.accent;
    top.forEach((e,i)=> x.fillText("#"+e[0], M + (i%3)*300, tagsLabelY + 56 + Math.floor(i/3)*58));
  }

  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today); start.setDate(start.getDate()-(WK-1)*7-((today.getDay()+6)%7));
  for(let w=0;w<WK;w++) for(let d=0;d<7;d++){
    const day=new Date(start); day.setDate(day.getDate()+w*7+d);
    if(day>today) continue;
    const n=hc[dayKey(day.getTime())]||0;
    x.fillStyle = HM_COLS[n===0?0:n<=1?1:n<=3?2:n<=6?3:4];
    roundRect(x, M + w*(cell+gap), hy + d*(cell+gap-2), cell, cell-4, 5); x.fill();
  }

  x.strokeStyle=T.dim; x.globalAlpha=.22; x.lineWidth=2;
  x.beginPath(); x.moveTo(M,footLineY); x.lineTo(W-M,footLineY); x.stroke(); x.globalAlpha=1;
  x.fillStyle=T.dim; x.font="400 24px -apple-system,'Segoe UI',sans-serif";
  x.fillText(t("wrapped_since")+" "+fmtDate(s.first), M, footTextY);
  x.fillStyle=T.accent; x.font="700 29px 'Bricolage Grotesque',serif";
  const brand="🪶 merlfy"; x.fillText(brand, W-M-x.measureText(brand).width, footTextY);
  return c;
}
function dataUrlToBlob(d){
  const bin = atob(d.split(",")[1]), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:"image/png" });
}
function shareCanvas(canvas){
  const render = blob=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const shut = ()=>{ ov.remove(); try{ URL.revokeObjectURL(url); }catch{} };
    const ov = el("div",{class:"overlay",onclick:e=>{ if(e.target===ov) shut(); }});
    const m = el("div",{class:"modal",style:"max-width:420px"});
    m.append(el("div",{class:"modal-head"}, el("h2",{text:t("share")}),
      el("button",{class:"icon-btn","aria-label":"close",text:"✕",onclick:shut})));
    const foot = el("div",{class:"modal-foot"});
    const mkFile = ()=> new File([blob],"merlfy-"+dayKey(Date.now())+".png",{type:"image/png"});
    let canShareFiles = false;
    try{ canShareFiles = !!(navigator.share && navigator.canShare && navigator.canShare({files:[mkFile()]})); }catch{}
    if(navigator.clipboard && window.ClipboardItem)
      foot.append(el("button",{class:"btn",text:t("card_copy"),onclick:async()=>{
        try{ await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]); toast(t("card_copied")); shut(); }
        catch{ toast("✕"); }
      }}));
    if(canShareFiles)
      foot.append(el("button",{class:"btn primary",text:t("share"),onclick:async()=>{
        try{ await navigator.share({files:[mkFile()], title:"Merlfy"}); }catch{}
      }}));
    else
      foot.append(el("button",{class:"btn primary",text:t("card_download"),onclick:()=>{
        const a = el("a",{href:url, download:mkFile().name}); document.body.append(a); a.click(); a.remove();
      }}));
    m.append(el("div",{class:"modal-body"},
      el("img",{src:url,alt:"",style:"width:100%;border-radius:10px;display:block;box-shadow:var(--shadow)"}),
      el("p",{class:"hint",style:"margin:10px 0 0",text:t("card_hint")})), foot);
    ov.append(m); modalRoot.append(ov);
  };
  if(typeof canvas.toBlob === "function")
    canvas.toBlob(b=>{ try{ render(b || dataUrlToBlob(canvas.toDataURL("image/png"))); }catch(e){ console.error(e); } }, "image/png");
  else render(dataUrlToBlob(canvas.toDataURL("image/png")));
}

function relTime(ts){
  const s = (Date.now()-ts)/1000;
  if(s<60) return t("just_now");
  if(s<3600) return Math.floor(s/60)+" "+t("min_ago");
  if(s<86400) return Math.floor(s/3600)+" "+t("hr_ago");
  const d = new Date(ts), now=new Date();
  const days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days===1) return t("yesterday");
  return fmtDate(ts);
}

function gateForm({mode}){
  const form = el("form");
  const err = el("div",{class:"err",style:"display:none"});
  const uIn = el("input",{class:"input", value: state._gateUser||"", autocomplete:"username", required:true});
  const dIn = el("input",{class:"input", autocomplete:"name"});
  const pIn = el("input",{class:"input", type:"password", autocomplete: mode==="login"?"current-password":"new-password", required:true});
  const p2In = el("input",{class:"input", type:"password", autocomplete:"new-password", required:true});

  form.append(field(t("username"), uIn));
  if(mode!=="login") form.append(field(t("displayname"), dIn));
  form.append(field(t("password"), pIn));
  if(mode!=="login") form.append(field(t("password2"), p2In));
  form.append(err);
  const btn = el("button",{class:"btn primary", type:"submit", style:"width:100%;justify-content:center",
    text: mode==="login"? t("login") : mode==="setup"? t("create_owner") : t("create_owner")});
  form.append(btn);

  form.addEventListener("submit", async e=>{
    e.preventDefault(); err.style.display="none"; btn.disabled=true;
    try{
      const username = uIn.value.trim();
      if(mode==="login"){
        const u = state.users.find(x=>x.username.toLowerCase()===username.toLowerCase());
        if(!u || !(await verifyPassword(pIn.value, u.passwordHash))) throw new Error(t("wrong_pass"));
        await loginAs(u);
      } else {
        if(!username) throw new Error(t("user_required"));
        if(pIn.value.length<4) throw new Error(t("pass_short"));
        if(pIn.value!==p2In.value) throw new Error(t("pass_mismatch"));
        let u;
        try{ u = await store.createUser({username, displayName:dIn.value.trim(), password:pIn.value}); }
        catch(ex){ if(ex.code==="taken") throw new Error(t("user_taken")); throw ex; }
        await loginAs(u);
      }
    }catch(ex){ err.textContent = ex.message; err.style.display="block"; btn.disabled=false; }
  });
  return form;
}
function field(label, input){
  const id = "f"+uid(); input.id=id;
  return el("div",{class:"field"}, el("label",{for:id,text:label}), input);
}

/* ---------- filtering / sorting ---------- */
function applyFilter(list){
  const f = state.filter;
  return list.filter(m=>{
    if(f.tag && !extractTags(m.content).includes(f.tag)) return false;
    if(f.date && dayKey(m.createdAt)!==f.date) return false;
    if(f.vis!=="all" && m.visibility!==f.vis) return false;
    if(f.hasImage && !(m.images&&m.images.length)) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      if(!m.content.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function sortMemos(list){
  return [...list].sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.createdAt-a.createdAt);
}

function renderCompImgs(){
  const box = $("#comp-imgs"); if(!box) return;
  box.innerHTML="";
  state.composer.images.forEach((src,i)=>{
    box.append(el("figure",{}, el("img",{src,alt:""}),
      el("button",{type:"button","aria-label":"remove",text:"×",onclick:()=>{ state.composer.images.splice(i,1); renderCompImgs(); }})));
  });
}
function wireComposer(){
  const ta = $("#comp-ta"); if(!ta) return;
  const draftKey = "merlfy.draft."+state.user.id;
  const grow = ()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,420)+"px"; };
  const countEl = $("#comp-count");
  const updateCount = ()=>{
    if(!countEl) return;
    const v = ta.value;
    countEl.textContent = v.trim() ? `${wordCount(v)} ${t("wc_word")} · ${v.length} ${t("wc_char")}` : "";
  };
  grow();
  updateCount();
  renderCompImgs();
  ta.addEventListener("input", ()=>{ grow(); updateCount(); try{ localStorage.setItem(draftKey, ta.value); }catch{}
    if(state.composer.preview) refreshPreview(); });
  ta.addEventListener("keydown", e=>{
    if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); doSave(); }
  });
  ta.addEventListener("paste", async e=>{
    const files = [...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));
    if(files.length){ e.preventDefault(); await addImages(files); }
  });
  const wrap = $("#composer");
  ["dragover","dragenter"].forEach(ev=>wrap.addEventListener(ev,e=>{ e.preventDefault(); wrap.style.borderColor="var(--accent)"; }));
  ["dragleave","drop"].forEach(ev=>wrap.addEventListener(ev,e=>{ e.preventDefault(); wrap.style.borderColor=""; }));
  wrap.addEventListener("drop", async e=>{
    const files = [...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith("image/"));
    if(files.length) await addImages(files);
  });
  $("#comp-file").addEventListener("change", async e=>{ await addImages([...e.target.files]); e.target.value=""; });
  $("#comp-img-btn").addEventListener("click", ()=>$("#comp-file").click());
  $("#comp-prev-btn").addEventListener("click", function(){
    state.composer.preview = !state.composer.preview;
    this.classList.toggle("on", state.composer.preview);
    $("#comp-prev").style.display = state.composer.preview? "block":"none";
    $("#comp-ta").style.display = state.composer.preview? "none":"block";
    if(state.composer.preview) refreshPreview();
  });
  $("#comp-save").addEventListener("click", doSave);

  async function addImages(files){
    for(const f of files.slice(0,8)){
      try{ state.composer.images.push(await fileToImage(f)); }catch{}
    }
    renderCompImgs();
  }
  function refreshPreview(){
    const p = $("#comp-prev");
    p.innerHTML = renderMarkdown($("#comp-ta").value) || `<p style="color:var(--text-faint)">${esc(t("preview"))}…</p>`;
    $$('input[type="checkbox"][data-task]', p).forEach(cb=>cb.disabled=true);
  }
  async function doSave(){
    const content = $("#comp-ta").value.trim();
    if(!content && !state.composer.images.length) return;
    const btn = $("#comp-save"); btn.disabled=true; btn.textContent=t("saving");
    const now = Date.now();
    const imgIds = [];
    for(const src of state.composer.images){
      const r = { id:uid(), userId:state.user.id, dataUrl:src, createdAt:now };
      await idbPut("resources", r); imgIds.push(r.id);
    }
    const promptQ = (state.composer.promptQ && content.includes(state.composer.promptQ)) ? state.composer.promptQ : null;
    await store.saveMemo({ id:uid(), userId:state.user.id, content, visibility:$("#comp-vis").value,
      pinned:false, createdAt:now, updatedAt:now, deletedAt:null, images:imgIds, source:"web", promptQ });
    state.composer.images=[]; state.composer.preview=false; state.composer.promptQ=null;
    try{ localStorage.removeItem(draftKey); }catch{}
    state.filter.q=""; state.filter.tag=null; state.filter.date=null;
    await renderApp();
  }
}

  if(f.tag) bar.append(el("span",{class:"active"}, "#"+f.tag, el("button",{text:"×","aria-label":"clear tag",onclick:()=>{ state.filter.tag=null; renderApp(); }})));

  return bar;
}
function softRefreshFeed(kind){
  const live = cache.memos.filter(m=>!m.deletedAt);
  let list;
  if(kind==="explore"){
    const shared = (cache.shared||[]).filter(m=>m.userId!==state.user.id || m.visibility!=="private");
    list = sortMemos(applyFilter(shared));
  } else list = sortMemos(applyFilter(live));
  const old = $("#feed-list"); if(old) old.replaceWith(feedList(list, kind));
}
function debounce(fn,ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a),ms); }; }

function feedList(list, kind){

function streak(daySet){
  let n=0; const d=new Date();
  if(!daySet.has(dayKey(d.getTime()))) d.setDate(d.getDate()-1);
  while(daySet.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function heatCard(live){
  const counts = {};
  live.forEach(m=>{ const k=dayKey(m.createdAt); counts[k]=(counts[k]||0)+1; });
  const card = el("div",{class:"card card-pad"});
  card.append(el("h3",{text:t("activity_title")}));
  const WEEKS=27, CELL=11, GAP=3, TOP=14, LEFT=16;
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today); start.setDate(start.getDate() - (WEEKS-1)*7 - ((today.getDay()+6)%7));
  const W = LEFT + WEEKS*(CELL+GAP), H = TOP + 7*(CELL+GAP);
  const NS="http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width","100%"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label",t("activity_title"));
  const color = c=> c===0?"var(--hm0)":c<=1?"var(--hm1)":c<=3?"var(--hm2)":c<=6?"var(--hm3)":"var(--hm4)";
  let lastMonth=-1;
  for(let w=0; w<WEEKS; w++){
    for(let d=0; d<7; d++){
      const day = new Date(start); day.setDate(day.getDate()+w*7+d);
      if(day>today) continue;
      const k = dayKey(day.getTime()); const c = counts[k]||0;
      const rect = document.createElementNS(NS,"rect");
      rect.setAttribute("x", LEFT+w*(CELL+GAP)); rect.setAttribute("y", TOP+d*(CELL+GAP));
      rect.setAttribute("width",CELL); rect.setAttribute("height",CELL); rect.setAttribute("rx",2);
      rect.setAttribute("fill", color(c)); rect.setAttribute("class","cell");
      rect.style.cursor="pointer";
      rect.addEventListener("click",()=>{ state.filter.date=k; state.view="feed"; state.page=1; renderApp(); });
      const ti = document.createElementNS(NS,"title"); ti.textContent = `${k} · ${c}`;
      rect.append(ti); svg.append(rect);
      if(d===0){
        const mo = day.getMonth();
        if(mo!==lastMonth){ lastMonth=mo;
          const tx = document.createElementNS(NS,"text");
          tx.setAttribute("x", LEFT+w*(CELL+GAP)); tx.setAttribute("y", 9); tx.setAttribute("class","lbl");
          tx.textContent = new Intl.DateTimeFormat(LANG==="tr"?"tr-TR":"en-US",{month:"short"}).format(day);
          svg.append(tx);
        }
      }
    }
  }
  card.append(el("div",{class:"heat"}, svg));
  card.append(el("div",{class:"heat-legend"},
    el("span",{text:t("heat_less")}),
    ...["var(--hm0)","var(--hm1)","var(--hm2)","var(--hm3)","var(--hm4)"].map(c=>el("i",{style:`background:${c}`})),
    el("span",{text:t("heat_more")})));
  return card;
}

function memoryGame(){
  const POOL = ["🪶","📎","✒️","📌","🔖","📖"];   // 6 çift → 12 kart
  let deck=[], flipped=[], moves=0, matched=0, startT=null, done=false;
  const card = el("div",{class:"card card-pad game-card"});
  const movesEl = el("b",{text:"0"});
  const timeEl  = el("b",{text:"0:00"});
  const status  = el("div",{class:"game-status"});
  const grid    = el("div",{class:"mem-grid"});
  const sb = scoreboardEl("memory", [
    {label:t("game_moves"), num:true, get:r=>String(r.meta.moves ?? "–")},
    {label:t("game_time"), num:true, get:r=>r.meta.time!=null ? fmtClock(r.meta.time) : "–"},
  ]);
  const head = el("div",{class:"game-head"},
    el("div",{class:"game-stat"}, movesEl, el("span",{text:t("game_moves")})),
    el("div",{class:"game-stat"}, timeEl, el("span",{text:t("game_time")})),
    el("span",{class:"sp"}),
    el("button",{class:"btn sm",text:t("game_new"),onclick:reset}));
  card.append(head, grid, status);

  function tick(){ if(startT) timeEl.textContent = fmtClock(Math.floor((Date.now()-startT)/1000)); }
  function draw(){
    grid.innerHTML="";
    deck.forEach((c,idx)=>{
      const open = c.matched || flipped.includes(idx);
      const b = el("button",{class:"mem-card"+(open?" open":"")+(c.matched?" matched":""),
        "aria-label":open?c.s:t("card_face_down"), text: open? c.s : ""});
      b.disabled = done || c.matched || flipped.includes(idx) || flipped.length===2;
      b.addEventListener("click",()=>flip(idx));
      grid.append(b);
    });
  }
  function flip(idx){
    if(done || flipped.includes(idx) || deck[idx].matched || flipped.length>=2) return;
    if(!startT){ startT=Date.now(); stopGameTimer(); gameTimer=setInterval(tick,500); }
    flipped.push(idx); draw();
    if(flipped.length===2){
      moves++; movesEl.textContent=String(moves);
      const [a,b]=flipped;
      if(deck[a].s===deck[b].s){
        deck[a].matched=deck[b].matched=true; matched++; flipped=[]; draw();
        if(matched===POOL.length) win();
      } else {
        setTimeout(()=>{ if(!grid.isConnected) return; flipped=[]; draw(); }, 720);
      }
    }
  }
  async function win(){
    done=true; stopGameTimer();
    const time=Math.floor((Date.now()-startT)/1000);
    const score = Math.max(10, 1000 - moves*12 - time*3);
    status.textContent = `${t("game_won")} ${moves} ${t("game_moves")} · ${fmtClock(time)} · ${score} ${t("game_score")}`;
    const prevBest = await scoreStore.best("memory");
    await scoreStore.add("memory", { player:playerName(), score, meta:{ moves, time } });
    if(!prevBest || score>prevBest.score) status.innerHTML += ` <span class="rec">${t("game_record")}</span>`;
    sb.reload();
  }
  function reset(){
    stopGameTimer();
    deck = [...POOL,...POOL].map(s=>({s,matched:false})).sort(()=>Math.random()-0.5);
    flipped=[]; moves=0; matched=0; startT=null; done=false;
    movesEl.textContent="0"; timeEl.textContent="0:00"; status.textContent="";
    draw();
  }
  reset();
  return el("div",{}, card, sb);
}

function mathGame(){
  const DURATION = 30;
  let score=0, streak=0, left=DURATION, running=false, answer=0;
  const card = el("div",{class:"card card-pad game-card"});
  const scoreEl=el("b",{text:"0"}), streakEl=el("b",{text:"0"}), leftEl=el("b",{text:String(DURATION)});
  const qEl = el("div",{class:"math-q",text:t("game_math_hint")});
  const inp = el("input",{class:"input math-in",type:"text",inputmode:"numeric",autocomplete:"off",disabled:true,"aria-label":"cevap"});
  const status = el("div",{class:"game-status"});
  const startBtn = el("button",{class:"btn primary sm",text:t("game_start")});
  const sb = scoreboardEl("math");
  card.append(
    el("div",{class:"game-head"},
      el("div",{class:"game-stat"}, scoreEl, el("span",{text:t("game_score")})),
      el("div",{class:"game-stat"}, streakEl, el("span",{text:t("game_streak")})),
      el("div",{class:"game-stat"}, leftEl, el("span",{text:t("game_left")})),
      el("span",{class:"sp"}), startBtn),
    qEl, inp, status);

  function newQ(){
    const ops=["+","−","×"], op=ops[Math.floor(Math.random()*3)];
    let a,b;
    if(op==="×"){ a=2+((Math.random()*11)|0); b=2+((Math.random()*11)|0); answer=a*b; }
    else if(op==="+"){ a=2+((Math.random()*49)|0); b=2+((Math.random()*49)|0); answer=a+b; }
    else { a=11+((Math.random()*40)|0); b=1+((Math.random()*(a-1))|0); answer=a-b; }
    qEl.textContent = `${a} ${op} ${b}`;
    inp.value=""; inp.focus();
  }
  function start(){
    if(running) return;
    running=true; score=0; streak=0; left=DURATION;
    scoreEl.textContent="0"; streakEl.textContent="0"; leftEl.textContent=String(left);
    status.textContent=""; inp.disabled=false; startBtn.disabled=true; startBtn.textContent="…";
    newQ();
    stopGameTimer();
    gameTimer=setInterval(()=>{ left--; leftEl.textContent=String(Math.max(0,left)); if(left<=0) end(); },1000);
  }
  async function end(){
    running=false; stopGameTimer();
    inp.disabled=true; startBtn.disabled=false; startBtn.textContent=t("game_restart");
    qEl.textContent=t("game_math_hint");
    status.textContent = `${t("game_over")} — ${score} ${t("game_score")}`;
    const prevBest = await scoreStore.best("math");
    await scoreStore.add("math", { player:playerName(), score, meta:{} });
    if(!prevBest || score>prevBest.score) status.innerHTML += ` <span class="rec">${t("game_record")}</span>`;
    sb.reload();
  }
  function submit(){
    if(!running || inp.value.trim()==="") return;
    if(Number(inp.value)===answer){
      score++; streak++; scoreEl.textContent=String(score); streakEl.textContent=String(streak); newQ();
    } else {
      streak=0; streakEl.textContent="0"; inp.value=""; inp.focus();
      card.classList.add("flash-bad"); setTimeout(()=>card.classList.remove("flash-bad"),220);
    }
  }
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); }});
  startBtn.addEventListener("click",start);
  return el("div",{}, card, sb);
}

// beyaz = içi boş glifler, siyah = dolu glifler — renk ters çevrilse bile ayırt edilir
const CHESS_GLYPH_W = { p:"♙", n:"♘", b:"♗", r:"♖", q:"♕", k:"♔" };
const CHESS_GLYPH_B = { p:"♟", n:"♞", b:"♝", r:"♜", q:"♛", k:"♚" };
const chessGlyph = (type,color)=> (color==="w"?CHESS_GLYPH_W:CHESS_GLYPH_B)[type];
const CHESS_GLYPH = CHESS_GLYPH_B; // kayıt/alınan taş listesi için
const CHESS_VAL   = { p:100, n:320, b:330, r:500, q:900, k:0 };
const PST = {
  p:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10,
     5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5,
     5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30,
     -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30,
     -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10,
     -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10,
     -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r:[0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10,
     -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10,
     -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
     20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
};
function chessEval(g){
  // + = white better (centipawns)
  let s = 0;
  const board = g.board();
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const c = board[r][f]; if(!c) continue;
    const idx = c.color==="w" ? r*8+f : (7-r)*8+f;
    const v = CHESS_VAL[c.type] + (PST[c.type] ? PST[c.type][idx] : 0);
    s += c.color==="w" ? v : -v;
  }
  return s;
}
function chessOrder(moves){
  return moves.slice().sort((a,b)=>{
    const av = (a.captured?CHESS_VAL[a.captured]:0) + (a.flags.includes("p")?800:0);
    const bv = (b.captured?CHESS_VAL[b.captured]:0) + (b.flags.includes("p")?800:0);
    return bv-av;
  });
}
function chessAiMove(g, level){
  const depth = level<=1 ? 1 : level===2 ? 2 : 3;
  let nodes = 0; const CAP = 200000;
  function nega(d, alpha, beta){
    const moves = g.moves({verbose:true});
    if(moves.length===0) return g.in_check() ? -30000 + (10 - d) : 0;   // mat / pat
    if(d===0 || nodes>CAP){
      const e = chessEval(g);
      return g.turn()==="w" ? e : -e;
    }
    let best = -Infinity;
    for(const m of chessOrder(moves)){
      nodes++;
      g.move(m);
      const val = -nega(d-1, -beta, -alpha);
      g.undo();
      if(val>best) best = val;
      if(best>alpha) alpha = best;
      if(alpha>=beta) break;
    }
    return best;
  }
  let bestMove=null, bestVal=-Infinity;
  const moves = chessOrder(g.moves({verbose:true}));
  for(const m of moves){
    g.move(m);
    let val = -nega(depth-1, -Infinity, Infinity);
    g.undo();
    if(level<=1) val += (Math.random()*60 - 30);       // kolay mod: gürültü
    if(val>bestVal){ bestVal=val; bestMove=m; }
    else if(val===bestVal && Math.random()<0.35){ bestMove=m; }
  }
  return bestMove || moves[0];
}
function chessGame(){
  const wrap = el("div",{});
  const Chess = window.Chess;
  const sb = scoreboardEl("chess", [
    {label:t("sb_result"), get:r=> resBadge(r.meta.result || "draw")},
    {label:t("sb_moves"), num:true, get:r=>String(r.meta.moves ?? "–")},
  ]);
  if(typeof Chess!=="function"){
    wrap.append(el("div",{class:"card card-pad",text:t("chess_need_lib")}), sb);
    return wrap;
  }
  const g = state.game;
  if(g.chessMode==="code") g.chessMode="ai";
  g.chessMode = g.chessMode || "ai";
  g.aiLevel = g.aiLevel || 2;

  let engine = new Chess();
  let names = g.chessMode==="ai"
    ? { w:playerName(), b:t("chess_ai") }
    : { w:t("chess_white"), b:t("chess_black") };
  let humanSide = g.humanSide==="b" ? "b" : "w";   // ai: hangi renk sensin (oturum boyunca hatırlanır)
  let sel = null, over = false, flip = false, aiThinking = false;

  /* ---- mod seçici ---- */
  const modes = el("div",{class:"chess-modes"});
  [["ai",t("chess_vs_ai")],["pass",t("chess_pass")]].forEach(([m,lb])=>
    modes.append(el("button",{class:g.chessMode===m?"on":"",text:lb,onclick:()=>{ g.chessMode=m; renderApp(); }})));
  wrap.append(modes);

  /* ---- ayar satırı ---- */
  const cfg = el("div",{class:"name-field"});
  const nameW = el("input",{value:names.w, maxlength:40, "aria-label":t("chess_name_w")});
  const nameB = el("input",{value:names.b, maxlength:40, "aria-label":t("chess_name_b")});
  if(g.chessMode==="ai"){
    const lvl = el("div",{class:"seg"});
    [[1,t("chess_easy")],[2,t("chess_normal")],[3,t("chess_hard")]].forEach(([n,lb])=>
      lvl.append(el("button",{class:g.aiLevel===n?"on":"",text:lb,onclick:()=>{
        g.aiLevel=n; [...lvl.children].forEach((b,i)=>b.classList.toggle("on", i===n-1));
      }})));
    const sideT = el("div",{class:"seg"});
    const setSide = s=>{ humanSide=s; g.humanSide=s; [...sideT.children].forEach((b,i)=>b.classList.toggle("on", (i===0)===(s==="w"))); };
    sideT.append(el("button",{text:t("chess_white"),onclick:()=>setSide("w")}), el("button",{text:t("chess_black"),onclick:()=>setSide("b")}));
    setSide(humanSide);
    cfg.append(el("label",{text:t("chess_ai_level")}), lvl, sideT);
  } else {
    cfg.append(el("label",{text:t("chess_white")}), nameW, el("label",{text:t("chess_black")}), nameB);
  }
  cfg.append(el("button",{class:"btn primary sm",text:t("chess_new"),onclick:()=>startNew()}));
  wrap.append(cfg);

  /* ---- tahta + yan panel ---- */
  const board = el("div",{class:"board"});
  const status = el("div",{class:"chess-status"});
  const capW = el("div",{class:"cap-row"});
  const capB = el("div",{class:"cap-row"});
  const moveList = el("div",{class:"movelist"});

  const btnFlip = el("button",{class:"btn ghost sm",text:t("chess_flip"),onclick:()=>{ flip=!flip; drawBoard(); }});
  const btnResign = el("button",{class:"btn ghost sm danger",text:t("chess_resign"),onclick:()=>{
    if(over || !confirm(t("chess_resign_q"))) return;
    finish(engine.turn()==="w" ? "b" : "w", "resign");
  }});
  const btnUndo = el("button",{class:"btn ghost sm",text:t("chess_undo"),onclick:()=>{
    if(over || aiThinking) return;
    engine.undo();
    if(g.chessMode==="ai" && engine.turn()!==humanSide) engine.undo();
    sel=null; drawBoard(); syncPanel();
  }});


  const btnPgn = el("button",{class:"btn ghost sm",text:t("chess_pgn"),onclick:()=>{
    if(!engine.history().length){ toast(t("chess_pgn_empty")); return; }
    try{
      engine.header("Event","Merlfy","Site","merlfy",
        "Date", new Date().toISOString().slice(0,10).replace(/-/g,"."),
        "White", names.w||t("chess_white"), "Black", names.b||t("chess_black"),
        "Result", engine.in_checkmate() ? (engine.turn()==="w"?"0-1":"1-0")
          : (engine.in_draw()||engine.in_stalemate()) ? "1/2-1/2" : "*");
    }catch{}
    const pgn = engine.pgn();
    if(navigator.clipboard){ navigator.clipboard.writeText(pgn).then(()=>toast(t("chess_pgn_copied")),()=>toast("✕")); }
    else toast(t("chess_pgn_copied"));
  }});

  const side = el("div",{class:"chess-side"});
  side.append(status,
    el("div",{}, el("div",{class:"hint",style:"font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px",text:t("chess_captured")}), capW, capB),
    moveList);
  const btnRow = el("div",{style:"display:flex;gap:6px;flex-wrap:wrap"}, btnFlip, btnUndo, btnPgn, btnResign);
  side.append(btnRow);

  wrap.append(el("div",{class:"chess-layout"},
    el("div",{class:"board-wrap"}, board), side), sb);

  /* ---- çizim ---- */
  function sqName(f,r){ return "abcdefgh"[f] + (r+1); }
  function drawBoard(){
    board.innerHTML="";
    const inCheckSq = engine.in_check() ? kingSquare(engine.turn()) : null;
    let legal = [];
    if(sel) legal = engine.moves({ square:sel, verbose:true });
    const rows = flip ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
    const files = flip ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
    for(const r of rows) for(const f of files){
      const name = sqName(f,r);
      const dark = (f + r) % 2 === 0;
      const cell = el("div",{class:"sq "+(dark?"dk":"lt"), dataset:{sq:name}});
      const pc = engine.get(name);
      if(pc) cell.append(el("span",{class:"pc "+pc.color, text:chessGlyph(pc.type, pc.color)}));
      if(sel===name) cell.classList.add("sel");
      const lm = legal.find(m=>m.to===name);
      if(lm){ cell.classList.add("mv"); if(lm.captured || lm.flags.includes("e")) cell.classList.add("cap"); }
      if(inCheckSq===name) cell.classList.add("chk");
      if(f===(flip?7:0)) cell.append(el("span",{class:"co r",text:String(r+1)}));
      if(r===(flip?7:0)) cell.append(el("span",{class:"co f",text:"abcdefgh"[f]}));
      cell.addEventListener("click",()=>onSquare(name));
      board.append(cell);
    }
  }
  function kingSquare(color){
    const b = engine.board();
    for(let r=0;r<8;r++) for(let f=0;f<8;f++){ const c=b[r][f]; if(c && c.type==="k" && c.color===color) return sqName(f,r); }
    return null;
  }
  function myTurn(){
    if(over || aiThinking) return false;
    if(g.chessMode==="pass") return true;
    return engine.turn()===humanSide;
  }
  function onSquare(name){
    modalRoot.querySelector(".promo-pop")?.remove();
    if(!myTurn()) return;
    const pc = engine.get(name);
    if(sel){
      if(name===sel){ sel=null; drawBoard(); return; }
      const opts = engine.moves({ square:sel, verbose:true }).filter(m=>m.to===name);
      if(opts.length){
        if(opts.some(m=>m.flags.includes("p"))){ askPromo(sel, name); return; }
        doMove({ from:sel, to:name });
        return;
      }
      if(pc && pc.color===engine.turn()){ sel=name; drawBoard(); return; }
      sel=null; drawBoard(); return;
    }
    if(pc && pc.color===engine.turn()){ sel=name; drawBoard(); }
  }
  function askPromo(from,to){
    modalRoot.querySelector(".promo-pop")?.remove();
    const ov = el("div",{class:"overlay promo-pop",onclick:e=>{ if(e.target===ov) ov.remove(); }});
    const pop = el("div",{class:"modal",style:"width:auto;padding:14px"});
    pop.append(el("div",{style:"font-size:12px;color:var(--text-dim);margin-bottom:8px;text-align:center",text:t("chess_promote")}));
    const row = el("div",{style:"display:flex;gap:6px"});
    const pcol = engine.turn();
    ["q","r","b","n"].forEach(p=>row.append(el("button",{class:"promo-btn",style:"font-size:30px;width:52px;height:52px;border:1px solid var(--border-strong);border-radius:8px",
      text:chessGlyph(p,pcol),"aria-label":p,onclick:()=>{ ov.remove(); doMove({ from, to, promotion:p }); }})));
    pop.append(row); ov.append(pop); modalRoot.append(ov);
  }
  function doMove(mv){
    const res = engine.move(mv);
    if(!res) return;
    sel=null;
    afterMove();
  }
  function afterMove(){
    drawBoard(); syncPanel();
    if(checkEnd()) return;
    if(g.chessMode==="ai" && engine.turn()!==humanSide){
      aiThinking = true; status.textContent = t("chess_ai_thinking");
      stopGameTimer();
      chessAiTimer = setTimeout(()=>{
        if(!board.isConnected) return;
        const m = chessAiMove(engine, g.aiLevel);
        aiThinking = false;
        if(m){ engine.move(m); drawBoard(); syncPanel(); if(!checkEnd()) status.innerHTML = turnLine(); }
      }, 220);
    } else {
      status.innerHTML = turnLine();
    }
  }
  function turnLine(){
    const base = engine.turn()==="w" ? t("chess_turn_w") : t("chess_turn_b");
    const chk = engine.in_check() ? ` <span style="color:var(--danger)">${t("chess_check")}</span>` : "";
    const who = g.chessMode==="pass" ? "" : (myTurn() ? ` <span style="color:var(--accent)">${t("chess_your_turn")}</span>` : "");
    return base + chk + who;
  }
  function syncPanel(){
    // alınan taşlar
    const capsW=[], capsB=[]; let advW=0, advB=0;
    engine.history({verbose:true}).forEach(m=>{
      if(m.captured){
        if(m.color==="w"){ capsW.push(m.captured); advW += CHESS_VAL[m.captured]; }
        else { capsB.push(m.captured); advB += CHESS_VAL[m.captured]; }
      }
    });
    const order = p=>({q:0,r:1,b:2,n:3,p:4}[p]);
    capsW.sort((a,b)=>order(a)-order(b)); capsB.sort((a,b)=>order(a)-order(b));
    capW.innerHTML=""; capB.innerHTML="";
    capW.append(el("span",{class:"hint",style:"font-size:10px;align-self:center;margin-right:2px",text:t("chess_white")}));
    capsW.forEach(p=>capW.append(el("span",{class:"pc b",text:CHESS_GLYPH[p]})));
    const d1 = Math.round((advW-advB)/100);
    if(d1>0) capW.append(el("span",{class:"adv",text:"+"+d1}));
    capB.append(el("span",{class:"hint",style:"font-size:10px;align-self:center;margin-right:2px",text:t("chess_black")}));
    capsB.forEach(p=>capB.append(el("span",{class:"pc b",text:CHESS_GLYPH[p]})));
    if(-d1>0) capB.append(el("span",{class:"adv",text:"+"+(-d1)}));
    // hamle listesi
    const h = engine.history();
    moveList.innerHTML="";
    for(let i=0;i<h.length;i+=2){
      moveList.append(el("span",{class:"mv-no",text:` ${i/2+1}.`}), document.createTextNode(" "+h[i]+" "+(h[i+1]||"")));
    }
    moveList.scrollTop = moveList.scrollHeight;
  }
  function checkEnd(){
    if(engine.in_checkmate()){ finish(engine.turn()==="w" ? "b" : "w", "checkmate"); return true; }
    if(engine.in_stalemate()){ finish(null, "stalemate"); return true; }
    if(engine.in_draw() || engine.insufficient_material() || engine.in_threefold_repetition()){ finish(null, "draw"); return true; }
    return false;
  }
  async function finish(winner, reason){
    if(over) return;
    over = true; aiThinking = false; sel=null; stopGameTimer();
    drawBoard();
    const plies = engine.history().length;
    const fullMoves = Math.ceil(plies/2);
    if(g.chessMode==="pass"){ names = { w:nameW.value.trim()||t("chess_white"), b:nameB.value.trim()||t("chess_black") }; }
    let line;
    if(!winner){
      line = reason==="stalemate" ? t("chess_stalemate") : t("chess_draw");
      await scoreStore.add("chess",{ player:names.w, score:0, meta:{ result:"draw", moves:fullMoves, mode:g.chessMode } });
      await scoreStore.add("chess",{ player:names.b, score:0, meta:{ result:"draw", moves:fullMoves, mode:g.chessMode } });
    } else {
      const wName = names[winner], lName = names[winner==="w"?"b":"w"];
      const pts = Math.max(10, 220 - plies);
      const prefix = reason==="checkmate" ? t("chess_checkmate")+" · "
        : reason==="resign" ? (LANG==="tr"?"Pes · ":"Resign · ") : "";
      line = `${prefix}${wName} ${t("chess_wins")}`;
      await scoreStore.add("chess",{ player:wName, score:pts, meta:{ result:"win", moves:fullMoves, mode:g.chessMode, opponent:lName } });
      await scoreStore.add("chess",{ player:lName, score:0, meta:{ result:"loss", moves:fullMoves, mode:g.chessMode, opponent:wName } });
    }
    status.innerHTML = `<span>${line}</span><span class="sub">${fullMoves} ${t("sb_moves").toLowerCase()}</span>`;
    sb.reload();
  }
  function startNew(){
    stopGameTimer();
    engine = new Chess();
    over=false; sel=null; aiThinking=false;
    if(g.chessMode==="ai"){
      names = { w: humanSide==="w"?playerName():t("chess_ai"), b: humanSide==="b"?playerName():t("chess_ai") };
      flip = humanSide==="b";
    } else {
      names = { w:nameW.value.trim()||t("chess_white"), b:nameB.value.trim()||t("chess_black") };
      flip = false;
    }
    drawBoard(); syncPanel();
    status.innerHTML = turnLine();
    if(g.chessMode==="ai" && humanSide==="b"){ afterMove(); }  // AI (beyaz) ilk hamleyi yapsın
  }

  startNew();
  return wrap;
}

/* ---------- trash ---------- */
function trashView(list){
  const box = el("div",{class:"feed"});
  if(!list.length){
    box.append(el("div",{class:"empty"}, el("div",{class:"big",text:"🗑"}),
      el("p",{style:"font-weight:600;color:var(--text)",text:t("empty_trash_t")}), el("p",{text:t("empty_trash_p")})));
    return box;
  }
  list.sort((a,b)=>b.deletedAt-a.deletedAt).forEach(m=>{
    const daysLeft = Math.max(0, 30 - Math.floor((Date.now()-m.deletedAt)/86400000));
    const card = el("article",{class:"memo"});
    card.append(el("div",{class:"memo-head"},
      el("time",{text:relTime(m.createdAt)}),
      el("span",{class:"vis",text:daysLeft+" "+t("deleted_in")}),
      el("span",{class:"sp"})));
    const tbody = el("div",{class:"prose",html:renderMarkdown(m.content)});
    $$('input[type="checkbox"][data-task]', tbody).forEach(cb=>cb.disabled=true);
    card.append(tbody);
    card.append(el("div",{style:"display:flex;gap:8px;margin-top:10px"},
      el("button",{class:"btn sm",text:t("restore"),onclick:async()=>{ m.deletedAt=null; await store.saveMemo(m); renderApp(); }}),
      el("button",{class:"btn sm danger",text:t("delete_forever"),onclick:async()=>{
        if(!confirm(t("confirm_del_forever"))) return;
        for(const id of (m.images||[])) await idbDel("resources",id);
        await idbDel("memos",m.id); renderApp();
      }})));
    box.append(card);
  });
  return box;
}

  p.append(el("hr",{style:"border:none;border-top:1px solid var(--border);margin:14px 0"}));
  p.append(el("h3",{text:t("change_pass")}), field(t("current_pass"),cur), field(t("new_pass"),np), pwErr);
